version: '3'

vars:
  BINARY: docker-config-gen
  CMD_DIR: ./cmd/docker-config-gen

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the binary
    cmds:
      - go build -o bin/{{.BINARY}} {{.CMD_DIR}}
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - bin/{{.BINARY}}

  run:
    desc: Build and run the binary
    deps: [build]
    cmds:
      - ./bin/{{.BINARY}} {{.CLI_ARGS}}

  test:
    desc: Run tests
    cmds:
      - go test ./...

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run ./...

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy

  docker:build:
    desc: Build Docker image
    cmds:
      - docker compose build --no-cache

  docker:run:
    desc: Run with Docker Compose
    cmds:
      - docker compose up

  docker:stop:
    desc: Stop Docker Compose
    cmds:
      - docker compose stop

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/
