name: CI

# Runs on pull requests, which nothing did before: the only workflow here builds and
# pushes on main, so a change was published before anything had checked it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer commit on the same branch supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Renderer
    runs-on: ubuntu-latest
    # A hang fails the job instead of holding a runner for six hours.
    timeout-minutes: 20
    steps:
      # Both repositories are checked out side by side, because the generator's job is
      # to produce a configuration that THIS template turns into something nginx loads.
      # The renderer tests read ../../../docker-proxy/nginx.template and skip when it is
      # absent — locally that is convenient, but in CI a skipped test proves nothing, so
      # the template is fetched.
      #
      # docker-proxy is pinned to its default branch, so this checks the generator
      # against the template that is live. A pull request that changes both repositories
      # will fail here until the docker-proxy side lands — which is the intended signal:
      # the two must agree, and the template has to be there first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: docker-config-gen

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: antimatter-studios/docker-proxy
          path: docker-proxy

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: docker-config-gen/go.mod
          cache-dependency-path: docker-config-gen/go.sum

      - name: gofmt
        working-directory: docker-config-gen
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Confirm the real template is being used
        run: test -f docker-proxy/nginx.template

      - working-directory: docker-config-gen
        run: go vet ./...

      - working-directory: docker-config-gen
        run: go build ./...

      - working-directory: docker-config-gen
        run: go test -race -count=1 ./...

      - name: The real-template tests must not have skipped
        working-directory: docker-config-gen
        run: |
          set -euo pipefail
          out=$(go test -count=1 -v ./internal/renderer/ -run 'TestMaxBodySize|TestHTTPS')
          echo "$out" | tail -30
          if echo "$out" | grep -q '^--- SKIP'; then
            echo "the tests that render the real template skipped; the template was not found" >&2
            exit 1
          fi

  image:
    name: Image
    runs-on: ubuntu-latest
    # A hang fails the job instead of holding a runner for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install chore (pinned + checksum-verified)
        # CI runs the same tasks a developer does, so it has to use the same runner.
        # A pinned release tarball, verified against its sha256, never an install
        # script piped from the network.
        env:
          CHORE_VERSION: 0.11.0
          # sha256 of chore-${CHORE_VERSION}-linux-x86_64.tar.gz, from that release's
          # checksums.txt. Bump both together.
          CHORE_SHA256: 0616bf7f7e21f1b3b951161c35c56da17eb59fcb7e59e90f8aa8ef32f1f2ff2c
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          asset="chore-${CHORE_VERSION}-linux-x86_64.tar.gz"
          curl --location --silent --show-error --fail \
            "https://github.com/antimatter-studios/chore/releases/download/v${CHORE_VERSION}/${asset}" \
            -o "$tmp/chore.tar.gz"
          echo "${CHORE_SHA256}  $tmp/chore.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/chore.tar.gz" -C "$tmp" chore
          sudo install -m 0755 "$tmp/chore" /usr/local/bin/chore
          rm -rf "$tmp"
          chore --version

      # The same check a developer runs: the binary in the image starts, and reports a
      # missing docker socket legibly rather than panicking or hanging. Running the
      # generator against a real proxy is the end-to-end test in docker-dev-tools.
      - name: The binary in the image must start and fail legibly
        run: chore image:smoke

  # The one check main requires (.githooks/required-checks). Jobs above can be renamed,
  # added or split without stranding a merge on a check that no longer reports.
  ci:
    name: CI
    needs: [test, image]
    if: always()
    runs-on: ubuntu-latest
    # A hang fails the job instead of holding a runner for six hours.
    timeout-minutes: 20
    steps:
      - run: |
          for r in '${{ needs.test.result }}' '${{ needs.image.result }}'; do
            case "$r" in success) ;; *) echo "a job CI depends on ended with: $r" >&2; exit 1 ;; esac
          done
