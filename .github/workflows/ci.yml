name: CI

# Runs on pull requests, which nothing did before: the only workflow here builds and
# pushes on main, so a change was published before anything had checked it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Renderer
    runs-on: ubuntu-latest
    steps:
      # Both repositories are checked out side by side, because the generator's job is
      # to produce a configuration that THIS template turns into something nginx loads.
      # The renderer tests read ../../../docker-proxy/nginx.template and skip when it is
      # absent — locally that is convenient, but in CI a skipped test proves nothing, so
      # the template is fetched.
      #
      # docker-proxy is pinned to its default branch, so this checks the generator
      # against the template that is live. A pull request that changes both repositories
      # will fail here until the docker-proxy side lands — which is the intended signal:
      # the two must agree, and the template has to be there first.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: docker-config-gen

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: antimatter-studios/docker-proxy
          path: docker-proxy

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: docker-config-gen/go.mod
          cache-dependency-path: docker-config-gen/go.sum

      - name: gofmt
        working-directory: docker-config-gen
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Confirm the real template is being used
        run: test -f docker-proxy/nginx.template

      - working-directory: docker-config-gen
        run: go vet ./...

      - working-directory: docker-config-gen
        run: go build ./...

      - working-directory: docker-config-gen
        run: go test -race -count=1 ./...

      - name: The real-template tests must not have skipped
        working-directory: docker-config-gen
        run: |
          set -euo pipefail
          out=$(go test -count=1 -v ./internal/renderer/ -run 'TestMaxBodySize|TestHTTPS')
          echo "$out" | tail -30
          if echo "$out" | grep -q '^--- SKIP'; then
            echo "the tests that render the real template skipped; the template was not found" >&2
            exit 1
          fi

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Plain docker build rather than an action: the runner already has buildx, and
      # this job only needs a local image, never a registry.
      - name: Build
        run: docker build -t docker-config-gen:ci .

      # The generator takes no flags — it is configured entirely by environment
      # variables and then watches the docker socket — so there is no --help to run and
      # no way to make it do a single pass and exit.
      #
      # What can be checked here is that the binary in the image starts and reports a
      # missing docker socket legibly instead of panicking or hanging. `timeout` bounds
      # it either way: a wedged container must fail this job, not run for six hours.
      #
      # Running the generator against a real proxy — labelled container in, rendered
      # config out — needs both images and is tracked separately.
      - name: The binary in the image must start and fail legibly
        run: |
          set -euo pipefail
          set +e
          out=$(timeout 30 docker run --rm -e DOCKER_SOCKET=/nonexistent/docker.sock \
            docker-config-gen:ci docker-config-gen 2>&1)
          rc=$?
          set -e
          echo "$out"
          echo "exit=$rc"

          case "$out" in
            *panic:*|*"runtime error"*)
              echo "the binary panicked instead of reporting the problem" >&2
              exit 1
              ;;
          esac
          if [ "$rc" = 124 ]; then
            echo "the binary hung with no docker socket instead of failing" >&2
            exit 1
          fi
          if [ "$rc" = 0 ]; then
            echo "the binary reported success with no docker socket" >&2
            exit 1
          fi
          echo "$out" | grep -qi 'docker' || {
            echo "the failure does not mention docker, so it would not be diagnosable" >&2
            exit 1
          }
