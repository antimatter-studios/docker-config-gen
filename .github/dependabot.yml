version: 2
updates:

  # Maintain dependencies for Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "area/chore"
      - "area/dockerfile"

  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # The workflows' actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
