services:
  docker-config-gen:
    image: ghcr.io/antimatter-studios/docker-config-gen:latest
    container_name: docker-config-gen
    build: .
    restart: always
    volumes:
      # REQUIRED: read-write access to the docker socket for events, inspection, and sidecar management
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared volume for management socket (must match docker-proxy)
      - management:/var/run/proxy
      # Shared volume for the per-host certificates the proxy serves HTTPS with. Mounted
      # at the same path as in the proxy, since that path goes into its configuration.
      - certs:/etc/nginx/certs
      # HTTPS is opt-in: mount the CA the certificates are issued with (ca.crt and
      # ca.key) by uncommenting this line and the `ca` volume below, or bind a directory
      # instead (- ./ca:/etc/docker-config-gen/ca:ro). Without it every host is HTTP-only.
      # - ca:/etc/docker-config-gen/ca:ro
    environment:
      # turns on a lot of useful debugging for dev purposes
      # warning: don't use this for production, it outputs env vars into the logs
      DEBUG: ${DEBUG:-false}
      # Path to the management Unix socket on the shared volume
      MANAGEMENT_SOCKET: /var/run/proxy/management.sock
      # Which renderer to use for template processing
      RENDERER: nginx
      # Name of the proxy container to discover networks from
      PROXY_CONTAINER: docker-proxy

volumes:
  management:
    external: true
  certs:
    external: true
  # ca:
  #   external: true
