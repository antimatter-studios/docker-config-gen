services:
  docker-config-gen:
    image: ghcr.io/antimatter-studios/docker-config-gen:latest
    container_name: docker-config-gen
    build: .
    restart: always
    volumes:
      # REQUIRED: access to the docker socket to listen for events and inspect containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Shared volume for management socket (must match docker-proxy)
      - management:/var/run/proxy
      # Shared volume for TLS certificates (future Let's Encrypt)
      - certs:/etc/nginx/certs
    environment:
      # turns on a lot of useful debugging for dev purposes
      # warning: don't use this for production, it outputs env vars into the logs
      DEBUG: ${DEBUG:-false}
      # Path to the management Unix socket on the shared volume
      MANAGEMENT_SOCKET: /var/run/proxy/management.sock
      # Which renderer to use for template processing
      RENDERER: nginx
      # Name of the proxy container to discover networks from
      PROXY_CONTAINER: docker-proxy

volumes:
  management:
    external: true
  certs:
    external: true
